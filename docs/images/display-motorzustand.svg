<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="title desc">
  <title id="title">Vorschau: Displayansicht Motorzustand</title>
  <desc id="desc">Schematische CYD-Displayvorschau mit Gesamtstatus und sechs farbcodierten Zustandsbalken.</desc>
  <rect width="360" height="290" rx="18" fill="#11151a"/>
  <rect x="10" y="10" width="340" height="270" rx="15" fill="#242a31" stroke="#59636e" stroke-width="2"/>
  <rect x="20" y="20" width="320" height="240" fill="#080d12"/>
  <g transform="translate(20 20)" font-family="Arial, Helvetica, sans-serif">
    <rect width="320" height="25" fill="#080d12"/>
    <text x="8" y="17" fill="#b4bec8" font-size="12" font-weight="700">MOTORZUSTAND</text>
    <text x="312" y="17" fill="#20e060" font-size="12" font-weight="700" text-anchor="end">OK</text>
    <path d="M0 25.5H320M0 205.5H320" fill="none" stroke="#303943"/>

    <g font-size="10" font-weight="600">
      <text x="8" y="45" fill="#20e060">OELDRUCK 3.4 bar</text>
      <text x="8" y="73" fill="#20e060">OELTEMP 96.0 C</text>
      <text x="8" y="101" fill="#20e060">WASSER 91.0 C</text>
      <text x="8" y="129" fill="#20e060">LADELUFT 34.0 C</text>
      <text x="8" y="157" fill="#20e060">ABGAS 742.0 C</text>
      <text x="8" y="185" fill="#20e060">BOOST 0.3 bar</text>
    </g>

    <g fill="none" stroke="#303943" stroke-width="1">
      <rect x="8" y="50" width="304" height="7" rx="1"/>
      <rect x="8" y="78" width="304" height="7" rx="1"/>
      <rect x="8" y="106" width="304" height="7" rx="1"/>
      <rect x="8" y="134" width="304" height="7" rx="1"/>
      <rect x="8" y="162" width="304" height="7" rx="1"/>
      <rect x="8" y="190" width="304" height="7" rx="1"/>
    </g>
    <g fill="#20e060">
      <rect x="10" y="52" width="146" height="3" rx="1"/>
      <rect x="10" y="80" width="170" height="3" rx="1"/>
      <rect x="10" y="108" width="194" height="3" rx="1"/>
      <rect x="10" y="136" width="122" height="3" rx="1"/>
      <rect x="10" y="164" width="178" height="3" rx="1"/>
      <rect x="10" y="192" width="132" height="3" rx="1"/>
    </g>

    <path d="M0 208H320" stroke="#303943"/>
    <text x="160" y="230" fill="#c7d0d9" font-size="12" text-anchor="middle">13.8 V  |  ECU VERBUNDEN</text>
  </g>
  <text x="180" y="278" fill="#9aa6b2" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">SCHEMATISCHE DISPLAY-VORSCHAU · 320 × 240</text>
</svg>
